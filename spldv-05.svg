<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Masalah kontekstual SPLDV"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f97316"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".16"/></filter></defs><rect width="1200" height="700" rx="34" fill="#f8fbff"/><rect x="24" y="24" width="1152" height="652" rx="28" fill="#fff" stroke="#cfe8f3" stroke-width="3"/><text x="60" y="72" font-family="Arial,sans-serif" font-size="38" font-weight="800" fill="#0b3558">Masalah kontekstual SPLDV</text><text x="60" y="108" font-family="Arial,sans-serif" font-size="22" fill="#587083">Dua struk berbeda memberi dua hubungan harga.</text><g font-family="Arial,sans-serif"><g filter="url(#shadow)"><rect x="95" y="160" width="430" height="340" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="310" y="210" text-anchor="middle" font-size="28" font-weight="800">STRUK A</text><text x="145" y="275" font-size="26">2 roti + 1 susu</text><text x="145" y="325" font-size="30" font-weight="800">Rp17.000</text><text x="145" y="410" font-size="24" fill="#0e7490">2x + y = 17.000</text><rect x="675" y="160" width="430" height="340" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><text x="890" y="210" text-anchor="middle" font-size="28" font-weight="800">STRUK B</text><text x="725" y="275" font-size="26">1 roti + 2 susu</text><text x="725" y="325" font-size="30" font-weight="800">Rp19.000</text><text x="725" y="410" font-size="24" fill="#f97316">x + 2y = 19.000</text></g></g><rect x="310" y="617" width="580" height="46" rx="23" fill="#0b3558"/><text x="600" y="649" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">bukti nyata → variabel → dua persamaan → tafsir</text></svg>