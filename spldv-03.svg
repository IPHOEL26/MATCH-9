<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Metode substitusi"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f97316"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".16"/></filter></defs><rect width="1200" height="700" rx="34" fill="#f8fbff"/><rect x="24" y="24" width="1152" height="652" rx="28" fill="#fff" stroke="#cfe8f3" stroke-width="3"/><text x="60" y="72" font-family="Arial,sans-serif" font-size="38" font-weight="800" fill="#0b3558">Metode substitusi</text><text x="60" y="108" font-family="Arial,sans-serif" font-size="22" fill="#587083">Ganti satu variabel dengan bentuk yang setara.</text><g font-family="Arial,sans-serif"><rect x="80" y="175" width="310" height="110" rx="20" fill="#ecfeff"/><text x="235" y="225" text-anchor="middle" font-size="27" font-weight="700">y = x + 1</text><text x="235" y="260" text-anchor="middle" font-size="22">x + y = 9</text><path d="M405 230 H535" stroke="#f97316" stroke-width="6" marker-end="url(#arrow)"/><rect x="550" y="175" width="310" height="110" rx="20" fill="#fff7ed"/><text x="705" y="242" text-anchor="middle" font-size="28" font-weight="700">x + (x + 1) = 9</text><path d="M875 230 H1000" stroke="#f97316" stroke-width="6" marker-end="url(#arrow)"/><rect x="875" y="350" width="245" height="130" rx="24" fill="#ecfdf5"/><text x="997" y="405" text-anchor="middle" font-size="30" font-weight="800">x = 4</text><text x="997" y="448" text-anchor="middle" font-size="30" font-weight="800">y = 5</text><path d="M705 295 C705 410 790 420 860 420" fill="none" stroke="#0e7490" stroke-width="5" marker-end="url(#arrow)"/></g><rect x="310" y="617" width="580" height="46" rx="23" fill="#0b3558"/><text x="600" y="649" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">isolasi → substitusi → selesaikan → cek</text></svg>