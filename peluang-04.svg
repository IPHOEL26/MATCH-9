<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Frekuensi harapan"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f97316"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".16"/></filter></defs><rect width="1200" height="700" rx="34" fill="#f8fbff"/><rect x="24" y="24" width="1152" height="652" rx="28" fill="#fff" stroke="#cfe8f3" stroke-width="3"/><text x="60" y="72" font-family="Arial,sans-serif" font-size="38" font-weight="800" fill="#0b3558">Frekuensi harapan</text><text x="60" y="108" font-family="Arial,sans-serif" font-size="22" fill="#587083">Peluang memberi perkiraan, bukan kepastian.</text><g font-family="Arial,sans-serif"><rect x="105" y="175" width="280" height="300" rx="28" fill="#eff6ff"/><text x="245" y="245" text-anchor="middle" font-size="27">peluang hujan</text><text x="245" y="330" text-anchor="middle" font-size="70" font-weight="900" fill="#0e7490">30%</text><text x="245" y="410" text-anchor="middle" font-size="25">selama 10 hari</text><path d="M410 325 H610" stroke="#f97316" stroke-width="7" marker-end="url(#arrow)"/><text x="510" y="300" text-anchor="middle" font-size="28">× 10</text><rect x="650" y="175" width="440" height="300" rx="28" fill="#ecfdf5"/><text x="870" y="255" text-anchor="middle" font-size="28">frekuensi harapan</text><text x="870" y="350" text-anchor="middle" font-size="70" font-weight="900" fill="#10b981">3 hari</text><text x="870" y="420" text-anchor="middle" font-size="23">hasil nyata dapat berbeda</text></g><rect x="310" y="617" width="580" height="46" rx="23" fill="#0b3558"/><text x="600" y="649" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">Fh = n × P(A)</text></svg>