<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Jaring-jaring tabung"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f97316"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".16"/></filter></defs><rect width="1200" height="700" rx="34" fill="#f8fbff"/><rect x="24" y="24" width="1152" height="652" rx="28" fill="#fff" stroke="#cfe8f3" stroke-width="3"/><text x="60" y="72" font-family="Arial,sans-serif" font-size="38" font-weight="800" fill="#0b3558">Jaring-jaring tabung</text><text x="60" y="108" font-family="Arial,sans-serif" font-size="22" fill="#587083">Selimut tabung terbuka menjadi persegi panjang.</text><g font-family="Arial,sans-serif"><circle cx="210" cy="300" r="105" fill="#bae6fd" stroke="#0e7490" stroke-width="5"/><circle cx="990" cy="300" r="105" fill="#bae6fd" stroke="#0e7490" stroke-width="5"/><rect x="330" y="190" width="540" height="220" rx="8" fill="#cffafe" stroke="#0e7490" stroke-width="5"/><line x1="330" y1="445" x2="870" y2="445" stroke="#f97316" stroke-width="5" marker-end="url(#arrow)"/><text x="600" y="485" text-anchor="middle" font-size="26">panjang = keliling alas = 2πr</text><line x1="900" y1="190" x2="900" y2="410" stroke="#f59e0b" stroke-width="5"/><text x="920" y="310" font-size="27">t</text><text x="210" y="305" text-anchor="middle" font-size="28">alas</text><text x="600" y="305" text-anchor="middle" font-size="30" font-weight="800">selimut</text><text x="990" y="305" text-anchor="middle" font-size="28">tutup</text></g><rect x="310" y="617" width="580" height="46" rx="23" fill="#0b3558"/><text x="600" y="649" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">L = 2πr² + 2πrt</text></svg>