<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Metode eliminasi"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f97316"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".16"/></filter></defs><rect width="1200" height="700" rx="34" fill="#f8fbff"/><rect x="24" y="24" width="1152" height="652" rx="28" fill="#fff" stroke="#cfe8f3" stroke-width="3"/><text x="60" y="72" font-family="Arial,sans-serif" font-size="38" font-weight="800" fill="#0b3558">Metode eliminasi</text><text x="60" y="108" font-family="Arial,sans-serif" font-size="22" fill="#587083">Samakan koefisien, lalu jumlahkan atau kurangkan.</text><g font-family="Arial,sans-serif"><rect x="155" y="160" width="620" height="320" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/><text x="210" y="230" font-size="35" font-weight="700">2x + y = 11</text><text x="210" y="295" font-size="35" font-weight="700">2x − y = 5</text><line x1="190" y1="325" x2="720" y2="325" stroke="#0b3558" stroke-width="4"/><text x="210" y="390" font-size="35" font-weight="800" fill="#0e7490">4x      = 16</text><text x="210" y="445" font-size="35" font-weight="800" fill="#f97316">x = 4, y = 3</text><circle cx="515" cy="262" r="70" fill="none" stroke="#ef4444" stroke-width="6" stroke-dasharray="12 8"/><text x="820" y="245" font-size="28" font-weight="700" fill="#ef4444">+y dan −y</text><text x="820" y="285" font-size="25">saling menghilangkan</text><path d="M825 310 C740 330 670 315 585 292" fill="none" stroke="#ef4444" stroke-width="5" marker-end="url(#arrow)"/></g><rect x="310" y="617" width="580" height="46" rx="23" fill="#0b3558"/><text x="600" y="649" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">hilangkan satu variabel → cari yang lain → cek</text></svg>