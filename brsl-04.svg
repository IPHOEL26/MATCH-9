<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Kerucut: r, t, dan s"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f97316"/></marker><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".16"/></filter></defs><rect width="1200" height="700" rx="34" fill="#f8fbff"/><rect x="24" y="24" width="1152" height="652" rx="28" fill="#fff" stroke="#cfe8f3" stroke-width="3"/><text x="60" y="72" font-family="Arial,sans-serif" font-size="38" font-weight="800" fill="#0b3558">Kerucut: r, t, dan s</text><text x="60" y="108" font-family="Arial,sans-serif" font-size="22" fill="#587083">Garis pelukis s membentuk segitiga siku-siku.</text><g font-family="Arial,sans-serif"><path d="M280 500 L600 145 L920 500 Z" fill="#cffafe" stroke="#0e7490" stroke-width="6"/><ellipse cx="600" cy="500" rx="320" ry="70" fill="#67e8f9" stroke="#0e7490" stroke-width="6"/><line x1="600" y1="145" x2="600" y2="500" stroke="#ef4444" stroke-width="6"/><line x1="600" y1="145" x2="920" y2="500" stroke="#f59e0b" stroke-width="8"/><line x1="600" y1="500" x2="920" y2="500" stroke="#0b3558" stroke-width="6"/><rect x="586" y="476" width="24" height="24" fill="none" stroke="#0b3558" stroke-width="3"/><text x="565" y="335" font-size="32" fill="#ef4444">t</text><text x="770" y="300" font-size="32" fill="#b45309">s</text><text x="755" y="485" font-size="32">r</text></g><rect x="310" y="617" width="580" height="46" rx="23" fill="#0b3558"/><text x="600" y="649" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">s² = r² + t²;  V = ⅓πr²t</text></svg>